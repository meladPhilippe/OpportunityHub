##
##      The liquibase.properties file stores properties which do not change often,
##      such as database connection information. Properties stored here save time
##      and reduce risk of mistyped command line arguments.
##      Learn more: https://www.liquibase.org/documentation/config_properties.html
####
####
##   Note about relative and absolute paths:
##      The liquibase.properties file requires paths for some properties.
##      The classpath is the path/to/resources (ex. src/main/resources).
##      The changeLogFile path is relative to the classpath.

# OpportunityHub Database Configuration
# Database: OpportunityHubDb 
# This file contains environment-specific connection information

# Path to changelog (relative to this file)
changeLogFile=master.xml

# SQL Server JDBC Driver Configuration
driver=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Database connection URL
# Update the server, port, and authentication details for your environment
url=jdbc:sqlserver://LOCALHOST:1433;databaseName=OpportunityHubDb;encrypt=true;trustServerCertificate=true

# Database credentials
username=OpportunityHubUser
password=OpportunityHub123

# Default catalog and schema for Liquibase tracking
#defaultCatalogName=OpportunityHubDb
defaultSchemaName=dbo

#liquibaseCatalogName=OpportunityHubDb
#liquibaseSchemaName=dbo

# Logging
logLevel=info
